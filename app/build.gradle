apply plugin: 'com.android.application'

configurations {
    all {
        exclude module: 'com.springsource.org.apache.commons.logging'
        exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.net'
        exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.httpclient'
        exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.codec'
        exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.io'
        exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.lang'
    }
}

// Display Xlint warnings. More info is at
// https://stackoverflow.com/questions/27274526/how-to-add-java-compiler-options-when-compiling-with-android-gradle-plugin/27274527
gradle.projectsEvaluated {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}

android {
    compileSdk 33

    // To build the app in release mode,
    // 1. uncomment these lines in the release block of the signingConfigs
    // 2. uncomment the line `signingConfig signingConfigs.release`
    // These lines are commented out for convenience of developers without signing keys, see
    // https://github.com/OSUPCVLab/mobile-ar-sensor-logger/issues/24
    signingConfigs {
//        release {
//            Properties properties = new Properties()
//            properties.load(project.rootProject.file('local.properties').newDataInputStream())
//            storeFile file(properties.getProperty('storeFile'))
//            keyAlias properties.getProperty('keyAlias')
//            storePassword properties.getProperty('storePassword')
//            keyPassword properties.getProperty('keyPassword')
//        }
    }
    defaultConfig {
        applicationId "edu.osu.pcv.marslogger"
        minSdkVersion 23
        targetSdkVersion 31
        versionCode 2
        versionName "2.1"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
//            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        /* https://github.com/rosjava/android_core/issues/194 */
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
    sourceSets.main {
        jniLibs.srcDir 'src/main/libs'
        jni.srcDirs = [];
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    flavorDimensions("freedom")
    productFlavors {
        google {
            dimension "freedom"
            buildConfigField "boolean", "DONATIONS_GOOGLE", "true"
        }
        fdroid {
            dimension "freedom"
            buildConfigField "boolean", "DONATIONS_GOOGLE", "false"
        }
    }
}

dependencies {
    api project(':libraries:rosandroid-core')
    implementation project(':libraries:rosandroid-core')

    implementation project(':libraries:devicelib')
    implementation 'io.github.cymchad:BaseRecyclerViewAdapterHelper:3.0.14'

    implementation 'org.ros.rosjava_core:rosjava_helpers:[0.3, 0.4)'

    // Android libraries
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.jakewharton.timber:timber:4.7.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.android.material:material:1.5.0'
    implementation "com.google.android.gms:play-services-location:19.0.1"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.5.0-alpha03'
    implementation 'androidx.navigation:navigation-ui:2.5.0-alpha03'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'org.apache.commons:commons-text:1.6'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

tasks.withType(JavaCompile) {
    compileTask -> compileTask.dependsOn ndkBuild
}

task ndkBuild(type: Exec) {
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    def ndkbuild = properties.getProperty('ndk.dir', null) + "/ndk-build"
    commandLine ndkbuild, '-C', file('src/main/jni').absolutePath
}
